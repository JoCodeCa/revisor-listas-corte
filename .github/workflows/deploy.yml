name: Publicar en Firebase Hosting

# Cada push a main publica la app.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probar el motor de comparación
        run: node test-engine.js && node test-renglones.js

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: revisor-cortes-taller
          channelId: live
          # Fijada: firebase-tools 15.34+ pide además el permiso serviceusage.services.get,
          # que la cuenta de servicio no tiene (falla con 403). Si se le agrega el rol
          # "Consumidor de Service Usage" en Google Cloud, se puede volver a "latest".
          firebaseToolsVersion: 15.32.1
